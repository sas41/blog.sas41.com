name: Build and deploy static blog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.170.0
  HUGO_BASEURL: https://blog.sas41.com/

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Set up Node.js for tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Hugo and build dependencies
        shell: bash
        run: |
          set -euo pipefail
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tools="$(mktemp -d)"
          curl --fail --silent --show-error --location "$release/$archive" --output "$tools/$archive"
          curl --fail --silent --show-error --location "$release/hugo_${HUGO_VERSION}_checksums.txt" --output "$tools/checksums.txt"
          expected="$(awk -v archive="$archive" '$2 == archive { print $1 }' "$tools/checksums.txt")"
          test -n "$expected"
          printf '%s  %s\n' "$expected" "$tools/$archive" | sha256sum --check -
          tar -xzf "$tools/$archive" -C "$tools" hugo
          echo "$tools" >> "$GITHUB_PATH"
          python -m pip install -r requirements-build.txt

      - name: Test
        run: |
          python -m unittest discover -s tests -v
          node --test tests/*.test.cjs

      - name: Build static site and revision history
        run: python scripts/build.py --destination public

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
