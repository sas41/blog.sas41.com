name: sas41-blog

services:
  blog:
    image: ${BLOG_IMAGE:?Set BLOG_IMAGE to your Forgejo registry image}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=1770
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BLOG_PORT:-8081}:8080"
    networks: [blog]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  remark42:
    image: ghcr.io/umputun/remark42:v1.18.0
    restart: unless-stopped
    environment:
      REMARK_URL: https://comments.blog.sas41.com
      SITE: blog.sas41.com
      SECRET: ${REMARK_SECRET:?Generate REMARK_SECRET before starting}
      ALLOWED_HOSTS: "https://blog.sas41.com,https://comments.blog.sas41.com"
      TRUSTED_PROXY: ${REMARK_TRUSTED_PROXY:?Set the exact upstream proxy IP or CIDR}
      AUTH_ANON: ${REMARK_AUTH_ANON:-true}
      AUTH_SAME_SITE: lax
      AUTH_EMAIL_ENABLE: ${REMARK_AUTH_EMAIL_ENABLE:-false}
      AUTH_EMAIL_FROM: ${REMARK_EMAIL_FROM:-}
      SMTP_HOST: ${REMARK_SMTP_HOST:-}
      SMTP_PORT: ${REMARK_SMTP_PORT:-587}
      SMTP_USERNAME: ${REMARK_SMTP_USERNAME:-}
      SMTP_PASSWORD: ${REMARK_SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${REMARK_SMTP_STARTTLS:-true}
      ADMIN_SHARED_ID: ${REMARK_ADMIN_IDS:-}
      ADMIN_SHARED_EMAIL: ${REMARK_ADMIN_EMAIL:-}
      ADMIN_PASSWD: ${REMARK_ADMIN_PASSWORD:-}
      NOTIFY_ADMINS: ${REMARK_NOTIFY_ADMINS:-none}
      NOTIFY_EMAIL_FROM: ${REMARK_EMAIL_FROM:-}
      BACKUP_PATH: /srv/var/backup
      MAX_BACKUP_FILES: "14"
      TIME_ZONE: UTC
      EMOJI: "true"
      MAX_COMMENT_SIZE: "5000"
      UPDATE_LIMIT: "0.5"
    volumes:
      - ./remark42-data:/srv/var
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${COMMENTS_PORT:-8082}:8080"
    networks: [blog]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  blog:
    ipam:
      config:
        - subnet: ${BLOG_NETWORK_SUBNET:-172.30.41.0/24}
          gateway: ${BLOG_NETWORK_GATEWAY:-172.30.41.1}
