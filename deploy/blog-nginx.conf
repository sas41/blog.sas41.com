worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # One policy map avoids nginx's surprising add_header inheritance rules.
    map $uri $cache_policy {
        default "public, max-age=0, must-revalidate";
        "~^/css/.*\.[a-f0-9]{64}\.css$" "public, max-age=31536000, immutable";
        "~^/js/.*\.[a-f0-9]{64}\.js$" "public, max-age=31536000, immutable";
        "~^/fonts/[a-z0-9-]+\.[a-f0-9]{16}\.woff2$" "public, max-age=31536000, immutable";
        "~^/history/[a-z0-9-]+/[a-f0-9]{64}\.(html|page\.html|json)$" "public, max-age=31536000, immutable";
    }
    map $status $cache_header {
        default "no-store";
        ~^[23] $cache_policy;
    }
    map $uri $robots_header {
        default "";
        ~^/history/ "noindex, follow";
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;

    server {
        listen 8080;
        listen [::]:8080;
        server_name blog.sas41.com;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;
        charset utf-8;
        error_page 404 /404.html;

        add_header Cache-Control $cache_header always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag $robots_header always;
        # Inline JSON-LD is non-executable. Scripts otherwise stay local, except
        # the comments loader. Explicit html shortcodes do not bypass this CSP.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://comments.blog.sas41.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://comments.blog.sas41.com; frame-src https:; media-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

        location = /healthz { default_type text/plain; }
        location ~ /\. { return 404; }
        location / { try_files $uri $uri/ =404; }
    }
}
