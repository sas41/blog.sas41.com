{{ define "main" }}
<section class="home-intro"><p class="eyebrow">THE ARCHIVE</p><h1>{{ .Title }}</h1>{{ .Content }}</section>
<div class="post-list">
{{ range .RegularPages.ByDate.Reverse }}
<article class="post-card"><div class="post-card-meta"><time data-local-time="date" datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006-01-02" }}</time></div><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2><p>{{ .Description }}</p>{{ partial "tags.html" . }}</article>
{{ end }}
</div>
{{ end }}
