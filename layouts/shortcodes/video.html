<figure>
  <video controls preload="metadata"{{ with .Get "poster" }} poster="{{ . }}"{{ end }}{{ if eq (.Get "muted") "true" }} muted{{ end }}{{ if eq (.Get "loop") "true" }} loop{{ end }}>
    <source src="{{ .Get "src" }}"{{ with .Get "type" }} type="{{ . }}"{{ end }}>
    {{ with .Get "captions" }}<track kind="captions" src="{{ . }}" srclang="{{ $.Get "lang" | default "en" }}" label="Captions" default>{{ end }}
    <a href="{{ .Get "src" }}">Download this video</a>.
  </video>
  {{ with .Get "caption" }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
